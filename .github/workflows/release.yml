name: Release EcConn

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  windows:
    name: Windows (Setup.exe & Portable.zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install FFmpeg & Inno Setup
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build Windows Installer & Portable Bundle
        shell: pwsh
        run: |
          .\scripts\build-windows-installer.ps1
          Compress-Archive -Path "dist\EcConn-Windows-Portable\*" -DestinationPath "dist\EcConn-Windows-Portable.zip" -Force

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist/EcConn-Setup.exe
            dist/EcConn-Windows-Portable.zip

  linux:
    name: Linux (AppImage & .deb)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxkbcommon-dev libwayland-dev \
            libgl1-mesa-dev libegl1-mesa-dev pkg-config \
            ffmpeg dpkg-dev desktop-file-utils wget

      - name: Build EcConn (app-host)
        run: cargo build --release -p app-host

      - name: Build EcConn-amd64.deb
        run: |
          mkdir -p dist
          PKG_DIR="dist/ecconn_1.0.0_amd64"
          mkdir -p "$PKG_DIR/DEBIAN" \
                   "$PKG_DIR/usr/bin" \
                   "$PKG_DIR/usr/share/applications" \
                   "$PKG_DIR/usr/share/icons/hicolor/256x256/apps"
          cp target/release/app-host "$PKG_DIR/usr/bin/ecconn"
          chmod 755 "$PKG_DIR/usr/bin/ecconn"
          cp packaging/linux/ecconn.png "$PKG_DIR/usr/share/icons/hicolor/256x256/apps/ecconn.png"
          sed 's/^Icon=.*/Icon=ecconn/' packaging/linux/ecconn.desktop > "$PKG_DIR/usr/share/applications/ecconn.desktop"
          cat > "$PKG_DIR/DEBIAN/control" <<'EOF'
          Package: ecconn
          Version: 1.0.0
          Section: utils
          Priority: optional
          Architecture: amd64
          Depends: ffmpeg, libgl1, libx11-6, libwayland-client0, libxkbcommon0
          Maintainer: EcConn
          Description: Wireless Extended Display & Screen Sharing (Host + Client)
          EOF
          dpkg-deb --build "$PKG_DIR" dist/EcConn-amd64.deb

      - name: Build EcConn-x86_64.AppImage
        run: |
          APPDIR="dist/EcConn.AppDir"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          cp target/release/app-host "$APPDIR/usr/bin/ecconn"
          chmod 755 "$APPDIR/usr/bin/ecconn"
          cp packaging/linux/ecconn.png "$APPDIR/ecconn.png"
          cp packaging/linux/ecconn.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/ecconn.png"
          sed 's/^Icon=.*/Icon=ecconn/' packaging/linux/ecconn.desktop > "$APPDIR/ecconn.desktop"
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/ecconn" "$@"
          EOF
          chmod 755 "$APPDIR/AppRun"
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O dist/appimagetool
          chmod +x dist/appimagetool
          ARCH=x86_64 dist/appimagetool --appimage-extract-and-run "$APPDIR" dist/EcConn-x86_64.AppImage

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            dist/EcConn-x86_64.AppImage
            dist/EcConn-amd64.deb

  android:
    name: Android (EcConn.apk)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/EcConn.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: dist/EcConn.apk

  release:
    name: Publish GitHub Release
    needs: [windows, linux, android]
    runs-on: ubuntu-24.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Prepare flat release assets
        run: |
          mkdir -p upload
          cp release-assets/windows-release/* upload/
          cp release-assets/linux-release/* upload/
          cp release-assets/android-release/* upload/
          ls -lh upload/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: "EcConn ${{ inputs.tag || github.ref_name }}"
          generate_release_notes: true
          body: |
            ## EcConn Releases

            ### Windows
            - **EcConn-Setup.exe** — Windows installer (bundles `EcConn.exe`, `server.exe`, `ffmpeg.exe`, Firewall & Virtual Display Driver setup)
            - **EcConn-Windows-Portable.zip** — Portable Windows zip (extract & run `EcConn.exe`)

            ### Linux
            - **EcConn-x86_64.AppImage** — Universal Linux AppImage (`chmod +x EcConn-x86_64.AppImage && ./EcConn-x86_64.AppImage`)
            - **EcConn-amd64.deb** — Debian/Ubuntu package (`sudo apt install ./EcConn-amd64.deb`)

            ### Android
            - **EcConn.apk** — Android Client + Host app
          files: upload/*
